[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends()/Header() in arg defaults is the intended FastAPI idiom
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SQL strings in API files routinely exceed 100 chars; wrapping them
# inside triple-quoted text() blocks hurts readability more than it helps.
# Raise the effective limit to 130 for these files only.
"app/api/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

name: integration-tests

# Runs the Ficium security/flow regression suite against both Supabase
# databases. DSNs are provided as repo secrets (session-pooler / direct
# connection strings, port 5432 — NOT the transaction pooler, since the tests
# use SET ROLE inside a transaction).
#
# Required repository secrets:
#   PORTAL_DB_DSN   postgresql://postgres.<ref>:<pw>@<host>:5432/postgres
#   APP_DB_DSN      postgresql://postgres.<ref>:<pw>@<host>:5432/postgres

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # allow manual runs
  schedule:
    - cron: "0 6 * * *"     # daily 06:00 UTC regression sweep

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install deps
        # The annotate plugin surfaces each failing test on the PR / check run.
        run: pip install -r requirements-dev.txt pytest-github-actions-annotate-failures==0.3.0

      - name: Require DB secrets (never skip silently)
        # Until 2026-10-19 neither secret existed, so every test in this job
        # was skipped and the job still reported green: the daily security
        # sweep had never run. Missing secrets are now a hard failure.
        env:
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
          APP_DB_DSN: ${{ secrets.APP_DB_DSN }}
        run: |
          missing=""
          [ -n "$PORTAL_DB_DSN" ] || missing="$missing PORTAL_DB_DSN"
          [ -n "$APP_DB_DSN" ]    || missing="$missing APP_DB_DSN"
          if [ -n "$missing" ]; then
            echo "::error title=integration::Repository secret(s) not set:$missing. Settings > Secrets and variables > Actions. Session pooler DSN, port 5432."
            exit 1
          fi

      - name: Migrations applied and unedited (db/ vs ops.schema_migration)
        # Fails if a db/*.sql file was merged but never applied, or edited
        # after it was applied. Closes the class behind the Aug 2026 incident
        # (008/009/010 merged, never run). Read-only.
        env:
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
        run: python scripts/migrate.py --check

      - name: Run integration suite
        env:
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
          APP_SERVICE_SECRET: integration-test-secret
          APP_DB_DSN: ${{ secrets.APP_DB_DSN }}
        run: pytest tests/test_integration.py -v --tb=short

      - name: Golden path (one deal end to end on MCB's live setup, rolled back)
        env:
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
        run: pytest tests/test_golden_path.py -v -s --tb=short

      - name: Golden path, both sides (App DB's own SQL + portal API, both rolled back)
        env:
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
          APP_DB_DSN: ${{ secrets.APP_DB_DSN }}
        # A skip would look green: fail unless the journey actually ran.
        run: |
          pytest tests/test_golden_path_two_sides.py -v -s --tb=short --junitxml=two_sides.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('two_sides.xml').getroot().find('testsuite') or E.parse('two_sides.xml').getroot(); n,k=int(s.get('tests')),int(s.get('skipped')); print(f'ran {n-k} of {n}'); exit(0 if n>0 and k==0 else 1)"

  go-live-readiness:
    # Live configuration the pilot needs (e.g. MCB's compliance documents).
    # Red here means "fix the setup", not "the code is broken".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Pilot bank is ready
        env:
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
        run: pytest tests/test_go_live.py -v --tb=short

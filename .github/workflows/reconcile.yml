name: reconcile

# Nightly: do the borrower app and the bank portal agree about every request,
# bid and deal? Read-only on both databases. A red run (and an error annotation
# per finding) means someone is being shown the wrong state. Decided cases go in
# scripts/reconcile_acknowledged.json.
on:
  schedule:
    - cron: "30 1 * * *"   # 05:30 Mauritius
  workflow_dispatch:
  pull_request:
    paths: ["scripts/reconcile.py", "scripts/reconcile_acknowledged.json", ".github/workflows/reconcile.yml"]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -q "sqlalchemy>=2" psycopg2-binary
      - name: Compare App DB and portal DB
        env:
          APP_DB_DSN: ${{ secrets.APP_DB_DSN }}
          PORTAL_DB_DSN: ${{ secrets.PORTAL_DB_DSN }}
        run: python scripts/reconcile.py

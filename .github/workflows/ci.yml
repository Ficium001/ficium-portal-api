name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for diff-aware scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --only-verified

  quality:
    runs-on: ubuntu-latest
    needs: secrets
    # Scratch Postgres for tests/test_migrate.py (the migration runner is tested
    # against real databases, never mocks). 17 = the production major version;
    # db/049 uses the MAINTAIN privilege, which needs 17+.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATE_TEST_PG: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --desc
      - name: Lint (ruff)
        run: python -m ruff check app tests --no-cache
      - name: Type-check (mypy)
        run: python -m mypy app
      - name: Test (pytest)
        run: python -m pytest -q
      - name: Build image
        run: docker build -t ficium-portal-api:ci .

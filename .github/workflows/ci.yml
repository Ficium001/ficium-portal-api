name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for diff-aware scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  quality:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency audit (pip-audit)
        # Report-only for now: brand-new gate with no triaged baseline
        # against existing pinned versions. Once findings are triaged
        # (real vulns bumped, false positives documented), remove
        # continue-on-error to make this a real gate.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc
        continue-on-error: true
      - name: Lint (ruff)
        run: python -m ruff check app tests --no-cache
      - name: Type-check (mypy)
        run: python -m mypy app
      - name: Test (pytest)
        run: python -m pytest -q
      - name: Build image
        run: docker build -t ficium-portal-api:ci .
